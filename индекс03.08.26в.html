<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- СЕО ОПТИМИЗАЦИЯ ДЛЯ ЯНДЕКСА И GOOGLE -->
    <title>Вячеслав Широнин — Официальный сайт | Тексты, книги и исследования</title>
    <meta name="description" content="Персональный сайт Вячеслава Широнина. Биография, портреты предков, архив академических и публицистических текстов, новые эксперименты с ИИ и индекс терминов.">
    <meta name="author" content="Вячеслав Широнин">
    
    <style>
        /* Авангардный брутализм/минимализм */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcfcfc;
            color: #111;
            line-height: 1.4;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        .hero-side {
            position: sticky;
            top: 40px;
            height: fit-content;
        }

        /* Строгое прямоугольное фото с эффектом при наведении */
        .photo-wrapper {
            background-color: #111;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .photo-wrapper:hover img {
            filter: grayscale(0%);
        }

        /* Крупный авангардный заголовок в две строки (Имя и Фамилия) */
        .headline {
            font-size: clamp(2.5rem, 5vw, 4.2rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            margin-bottom: 35px;
        }

        /* Внешние платформы */
        .external-links a {
            display: inline-block;
            color: #111;
            text-decoration: none;
            font-weight: 700;
            margin-right: 20px;
            border-bottom: 2px solid #111;
            padding-bottom: 2px;
        }

        .external-links a:hover {
            background-color: #111;
            color: #fcfcfc;
        }

        /* Навигация по разделам */
        .nav-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .nav-group {
            margin-bottom: 50px;
        }

        .nav-group-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        .menu-link {
            display: block;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 700;
            color: #111;
            text-decoration: none;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            transition: transform 0.2s ease, padding-left 0.2s ease;
        }

        .menu-link:hover {
            transform: translateX(10px);
            color: #000;
        }

        /* Авангардный акцент на ИИ */
        .menu-link.ai-accent:hover {
            color: #ff3b30; 
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .hero-side {
                position: relative;
                top: 0;
            }
            body {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ЛЕВАЯ СТОРОНА: Автор -->
        <section class="hero-side">
            <div class="photo-wrapper">
                <!-- Разместите файл фото (например, photo.jpg) в той же папке на хостинге -->
                <img src="photo.jpg" alt="Вячеслав Широнин — Экономист, исследователь, писатель">
            </div>
            
            <h1 class="headline">ВЯЧЕСЛАВ<br>ШИРОНИН</h1>
            
            <div class="external-links">
                <a href="https://github.com" target="_blank" rel="noopener">GITHUB ↗</a>
                <a href="https://substack.com" target="_blank" rel="noopener">SUBSTACK ↗</a>
            </div>
        </section>

        <!-- ПРАВАЯ СТОРОНА: Разделы (2-й уровень) -->
        <main class="nav-side">
            
            <nav class="nav-group" aria-label="Контекст и Автор">
                <div class="nav-group-title">Контекст и Автор</div>
                <a href="bio.html" class="menu-link">Био</a>
                <a href="ancestors.html" class="menu-link">Портреты предков</a>
            </nav>

            <nav class="nav-group" aria-label="Архивы и тексты">
                <div class="nav-group-title">Архивы и эксперименты</div>
                <a href="old-texts.html" class="menu-link">Старые тексты</a>
                <a href="ai-texts.html" class="menu-link ai-accent">Новые тексты [ИИ]</a>
            </nav>

            <nav class="nav-group" aria-label="База данных">
                <div class="nav-group-title">База данных</div>
                <a href="index-list.html" class="menu-link">Термины и ссылки</a>
            </nav>

        </main>
        
    </div>

</body>
</html>
